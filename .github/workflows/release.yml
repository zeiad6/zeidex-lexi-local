# Builds the desktop installers on a version tag (git tag v1.0.0 && git push --tags)
# and attaches them to the GitHub Release. Run manually from the Actions tab to get artifacts only.
name: Release desktop packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win msi
          - os: ubuntu-latest
            target: --linux AppImage deb tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            release/*.msi
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.msi
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
