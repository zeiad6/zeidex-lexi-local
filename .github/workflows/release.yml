# Builds every package on a version tag (git tag v1.0.0 && git push --tags), signs them, and
# attaches them plus the signed update manifest to the GitHub Release.
#
# Required repository secrets (values from ~/.zeidex-keys/lexi-local, see scripts/release-keys.mjs):
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD     (Authenticode; skipped if empty)
#   UPDATE_SIGNING_KEY                     (ECDSA P-256 PEM for lexi-local.json)
#   WIN_SIGNER_SHA1                        (optional: thumbprint the desktop updater must see)
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win msi
          - os: ubuntu-latest
            target: --linux AppImage deb tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.msi
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Decode signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build signed APK
        working-directory: android
        env:
          LEXI_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          LEXI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEXI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEXI_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release && cp "$APK" "release/Zeidex-Lexi-Local-${GITHUB_REF_NAME#v}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*.apk
          if-no-files-found: error

  manifest:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Sign update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          WIN_SIGNER_SHA1: ${{ secrets.WIN_SIGNER_SHA1 }}
        run: node scripts/release-manifest.mjs --dir release
      - uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: |
            release/lexi-local.json
            release/SHA256SUMS
            release/SHA256SUMS.sig
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
