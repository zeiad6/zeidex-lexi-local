<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Summarize papers and books entirely in your browser — nothing leaves your device." />
    <meta name="theme-color" content="#1f2a44" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Lexi Local</title>
    <script>
      // Apply the saved theme/language before React mounts to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
        const l = localStorage.getItem("lang");
        if (l === "en") document.documentElement.setAttribute("lang", "en"), document.documentElement.setAttribute("dir", "ltr");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
