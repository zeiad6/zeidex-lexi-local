# Portable settings only. Machine-specific overrides (JDK path, aapt2 on ARM hosts) belong in
# ~/.gradle/gradle.properties so CI and other machines are not broken by them.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.caching=true
android.nonTransitiveRClass=true
kotlin.code.style=official
